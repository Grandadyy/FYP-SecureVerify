<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scan Logs — SecureVerify</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#2c3e50}.layout{display:flex;min-height:100vh}.sidebar{width:230px;background:#1a3c6e;color:white;padding:22px 15px}.sidebar a{display:block;color:#e8eef6;text-decoration:none;padding:12px;border-radius:7px}.sidebar a:hover{background:#ffffff20}.main{padding:28px;flex:1;min-width:0}.card{background:white;border-radius:12px;padding:20px;box-shadow:0 2px 12px #0001;overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e5eaf0;white-space:nowrap}th{color:#718096}.badge{padding:5px 9px;border-radius:20px;font-weight:bold;font-size:12px}.authentic{background:#d5f5e3;color:#1e8449}.suspicious{background:#fef3c7;color:#946200}.counterfeit{background:#fcd9d9;color:#922b21}input{padding:10px;border:1px solid #ddd;border-radius:7px;max-width:300px;width:100%}@media(max-width:650px){.layout{display:block}.sidebar{width:auto}.main{padding:15px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase-client.js"></script></head><body><div class="layout"><aside class="sidebar"><h2>🔐 SecureVerify</h2><p>Admin</p><a href="dashboard.html">📊 Dashboard</a><a href="scan-log.html">📋 Scan Logs</a><a href="verify.html">🔍 Verify Product</a><a href="#" onclick="logout();return false">🚪 Logout</a></aside><main class="main"><h1>Scan Activity Logs</h1><p>Live verification records from the shared database.</p><p><input id="search" placeholder="Search product, batch or result" oninput="render()"></p><section class="card"><div style="overflow-x:auto"><table><thead><tr><th>Time</th><th>Product</th><th>Batch</th><th>Result</th><th>Device/browser</th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading…</td></tr></tbody></table></div></section></main></div><script>let logs=[];async function boot(){if(!svRequireConfig())return;const {data:{session}}=await svClient.auth.getSession();if(!session){location.replace('admin-login.html');return}const {data:admin}=await svClient.from('admin_users').select('user_id').eq('user_id',session.user.id).maybeSingle();if(!admin){alert('Administrator access required.');location.replace('admin-login.html');return}const {data,error}=await svClient.from('scan_logs').select('id,scanned_at,result,user_agent,products(name,batch_number)').order('scanned_at',{ascending:false}).limit(500);if(error){alert(error.message);return}logs=data||[];render()}function render(){const q=(document.getElementById('search').value||'').toLowerCase();const rows=document.getElementById('rows');rows.innerHTML='';const filtered=logs.filter(x=>[x.result,x.products?.name,x.products?.batch_number].join(' ').toLowerCase().includes(q));if(!filtered.length){rows.innerHTML='<tr><td colspan="5">No matching scan records.</td></tr>';return}filtered.forEach(x=>{const tr=document.createElement('tr');const vals=[new Date(x.scanned_at).toLocaleString(),x.products?.name||'Unknown / invalid code',x.products?.batch_number||'—'];vals.forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});const td=document.createElement('td');td.innerHTML='<span class="badge '+x.result+'">'+x.result.toUpperCase()+'</span>';tr.appendChild(td);const ua=document.createElement('td');ua.textContent=(x.user_agent||'').slice(0,90);tr.appendChild(ua);rows.appendChild(tr)})}async function logout(){await svClient.auth.signOut();location.href='admin-login.html'}boot();</script></body></html>
