<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — SecureVerify</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#1a3c6e,#2c5282);min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:white;border-radius:16px;padding:36px;width:min(100%,430px);box-shadow:0 18px 50px #0003}.brand{text-align:center;color:#1a3c6e;margin-bottom:24px}.brand .icon{font-size:42px}.brand h1{margin:8px 0}.brand p{color:#718096;font-size:14px}.field{margin:16px 0}label{display:block;font-weight:700;font-size:14px;margin-bottom:7px;color:#2c3e50}input{width:100%;padding:13px;border:1px solid #dce3eb;border-radius:8px;font-size:15px}.btn{width:100%;padding:13px;border:0;border-radius:8px;background:#1a3c6e;color:white;font-weight:700;font-size:15px;cursor:pointer;margin-top:8px}.msg{padding:11px;border-radius:8px;background:#fef0f0;color:#922b21;display:none;font-size:14px}.links{text-align:center;margin-top:20px;font-size:14px}.links a{color:#1a3c6e}.note{font-size:12px;color:#718096;line-height:1.5;margin-top:18px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase-client.js"></script></head><body><main class="card"><div class="brand"><div class="icon">🔐</div><h1>SecureVerify</h1><p>Manufacturer administrator access</p></div><div class="msg" id="msg"></div><div class="field"><label>Email address</label><input id="email" type="email" autocomplete="username" placeholder="admin@company.com"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Your password"></div><button class="btn" onclick="login()">Sign in</button><div class="links"><a href="index.html">← Back to home</a></div><p class="note">Administrator accounts are created in your Supabase project. There are no default demo credentials.</p></main><script>async function login(){const m=document.getElementById('msg');m.style.display='none';if(!svRequireConfig())return;const {data,error}=await svClient.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){m.textContent=error.message;m.style.display='block';return}location.href='dashboard.html'}document.addEventListener('keydown',e=>{if(e.key==='Enter')login()});if(svConfigured)svClient.auth.getSession().then(({data})=>{if(data.session)location.replace('dashboard.html')});</script></body></html>
